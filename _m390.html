<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>390×844 확인용</title>
<style>
  html,body{margin:0;background:#1b2430;font-family:-apple-system,"Noto Sans KR",sans-serif;color:#cfdae6;}
  .wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;}
  .cap{font-size:12px;letter-spacing:.2px;}
  iframe{width:390px;height:844px;border:0;background:#fff;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.5);}
</style>
</head>
<body>
<div class="wrap">
  <div class="cap" id="cap">390 × 844</div>
  <iframe id="f" src="index.html?v=ml-final"></iframe>
</div>
<script>
/* 확인용 페이지(배포본에는 포함하지 않음).
   ?s=chat-ja | chat-empty | sub-jp | sub-es | sub-ko | sub-en */
(function () {
  var f = document.getElementById('f');
  var sc = new URLSearchParams(location.search).get('s') || '';
  document.getElementById('cap').textContent = '390 × 844 · ' + (sc || 'idle');
  f.addEventListener('load', function () {
    var W = f.contentWindow, I = W.__interpreter;
    if (!I) return;
    function push(txt, from, tag) { I.subtitle.push(txt, from, tag || ''); }
    try {
      if (sc === 'chat-ja') {
        I.setPartner('ja');
        I.clear();
        I.add('out', '안녕하세요, 저는 국가데이터처 윤기준입니다.', 'こんにちは。私はデータ統計部のユン・ギジュンです。', 'text');
        I.add('in', '会議は何時に始まりますか', '회의는 몇 시에 시작하나요?', 'speech');
        I.openQuick();
      } else if (sc === 'chat-es') {
        I.setPartner('es');
        I.clear();
        I.add('out', '조금 천천히 말씀해 주시겠어요?', '¿Podría hablar un poco más despacio?', 'quick');
        I.add('in', '¿A qué hora empieza la sesión?', '세션은 몇 시에 시작하나요?', 'speech');
      } else if (sc === 'sub-jp') {
        I.subtitle.open();
        I.subtitle.setLang('ja');
        I.subtitle.setTTS(true);
        I.subtitle.activate();
        push('本日のセッションはジェムフォーの活用についてです。', 'ja', '');
        push('データの匿名化と小規模セルの保護が重要です。', 'ja', '');
      } else if (sc === 'sub-es') {
        I.subtitle.open();
        I.subtitle.setLang('es');
        I.subtitle.setTTS(true);
        I.subtitle.activate();
        push('Hoy hablamos de la inteligencia artificial agéntica.', 'es', '');
        push('La reunión empieza a las diez de la mañana.', 'es', '');
      } else if (sc === 'sub-ko') {
        I.subtitle.open();
        I.subtitle.setLang('ko');
        I.subtitle.setTTS(true);
        I.subtitle.activate();
        push('오늘 세션은 에이전틱 AI 활용에 관한 내용입니다.', 'ko', '');
      } else if (sc === 'sub-en') {
        I.subtitle.open();
        I.subtitle.setLang('en');
        I.subtitle.setTTS(true);
        I.subtitle.activate();
        push('Welcome to the SAS Innovate conference.', 'en', '');
      }
    } catch (e) {
      document.getElementById('cap').textContent = 'ERR ' + e.message;
    }
  });
})();
</script>
</body>
</html>
